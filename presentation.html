<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodWatch — Project Presentation Deck (SDG 2)</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="js/pptx_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Control Bar */
    .deck-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .deck-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }
    .deck-brand span {
      color: #10b981;
    }
    .badge-pill {
      font-size: 0.72rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .deck-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
      text-decoration: none;
    }
    .btn-ctrl.primary {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-ctrl.primary:hover {
      background: linear-gradient(135deg, #059669, #047857);
    }
    .slide-counter {
      font-size: 0.88rem;
      font-weight: 700;
      color: #94a3b8;
      min-width: 70px;
      text-align: center;
    }

    /* Deck Viewport */
    .deck-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .slide-frame {
      width: 100%;
      max-width: 1150px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      color: #0f172a;
      border-radius: 16px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Slide Content Layouts */
    .slide-dark {
      background: #0a0f1d !important;
      color: #f8fafc !important;
    }
    .slide-header {
      padding: 1.8rem 2.5rem 0.8rem 2.5rem;
    }
    .slide-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }
    .slide-tag.green { background: #d1fae5; color: #065f46; }
    .slide-tag.green-dark { background: rgba(16,185,129,0.2); color: #34d399; }
    .slide-tag.blue { background: #dbeafe; color: #1e40af; }
    .slide-tag.amber { background: #fef3c7; color: #92400e; }
    .slide-tag.purple { background: #ede9fe; color: #5b21b6; }

    .slide-title {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.25;
      color: #0f172a;
    }
    .slide-dark .slide-title { color: #ffffff; }
    .slide-sub {
      font-size: 0.95rem;
      color: #64748b;
      margin-top: 0.25rem;
    }
    .slide-dark .slide-sub { color: #94a3b8; }

    .slide-body {
      flex: 1;
      padding: 0.8rem 2.5rem 1.8rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.2rem;
    }

    .slide-footer {
      padding: 0.8rem 2.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .slide-dark .slide-footer {
      border-top-color: rgba(255, 255, 255, 0.08);
      color: #64748b;
    }

    /* Grids & Cards */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      height: 100%;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      height: 100%;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      height: 100%;
    }
    .card-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .card-box.dark {
      background: #131b2e;
      border-color: #1e293b;
      color: #f8fafc;
    }
    .stat-huge {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .text-emerald { color: #10b981; }
    .text-blue { color: #2563eb; }
    .text-amber { color: #f59e0b; }
    .text-red { color: #ef4444; }
    .text-purple { color: #8b5cf6; }

    /* Speaker Notes Drawer */
    .notes-drawer {
      max-width: 1150px;
      margin: 0 auto 2rem auto;
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .notes-drawer h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #10b981;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .notes-content {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* Presentation navigation hotkeys */
    .keyboard-hint {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .keyboard-hint kbd {
      background: #1e293b;
      color: #cbd5e1;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    /* Floating Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #059669;
      color: #ffffff;
      padding: 0.85rem 1.4rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

    let currentIdx = 0;

    function renderCurrentSlide() {
      const slide = slidesData[currentIdx];
      const frame = document.getElementById('slideFrame');
      
      frame.className = 'slide-frame' + (slide.isDark ? ' slide-dark' : '');
      
      frame.innerHTML = `
        <div class="slide-header">
          <span class="slide-tag ${slide.tagClass}">${slide.tag}</span>
          <h2 class="slide-title">${slide.title}</h2>
          <div class="slide-sub">${slide.sub}</div>
        </div>
        <div class="slide-body">
          ${slide.render()}
        </div>
        <div class="slide-footer">
          <div>FoodWatch | 1M1B Initiative • UN SDG 2: Zero Hunger</div>
          <div>Slide ${slide.id} of ${slidesData.length}</div>
        </div>
      `;

      document.getElementById('slideNum').textContent = `${slide.id} / ${slidesData.length}`;
      document.getElementById('speakerNotes').textContent = slide.notes;
    }

    function nextSlide() {
      if (currentIdx < slidesData.length - 1) {
        currentIdx++;
        renderCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        currentIdx--;
        renderCurrentSlide();
      }
    }

    function toggleFullscreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          alert(`Error attempting fullscreen: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // Download PPTX Handler (Embedded Base64 Blob + Fallback)
    function downloadPPTX() {
      const fileName = "FoodWatch_Project_Presentation.pptx";

      try {
        if (window.FOODWATCH_PPTX_BASE64) {
          const byteCharacters = atob(window.FOODWATCH_PPTX_BASE64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], {
            type: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 1500);
          showToast("🎉 " + fileName + " downloaded successfully!");
          return;
        }
      } catch (err) {
        console.warn("Base64 blob download attempt encountered:", err);
      }

      // Standard fallback link
      const fallbackLink = document.createElement("a");
      fallbackLink.style.display = "none";
      fallbackLink.href = fileName;
      fallbackLink.download = fileName;
      document.body.appendChild(fallbackLink);
      fallbackLink.click();
      setTimeout(() => document.body.removeChild(fallbackLink), 1000);
      showToast("📥 Download started for " + fileName);
    }

    function showToast(msg) {
      let toast = document.getElementById("toastNotification");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "toastNotification";
        toast.className = "toast";
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3500);
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 'd' || e.key === 'D') {
        downloadPPTX();
      }
    });

    // Initial render
    renderCurrentSlide();
  </script>
